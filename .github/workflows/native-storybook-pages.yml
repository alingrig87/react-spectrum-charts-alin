name: Build and deploy native charts Storybook (web) to GitHub Pages
# On-device Storybook (@storybook/react-native) for the hand-drawn
# react-spectrum-charts-native-charts package, exported as a static
# react-native-web build and published to GitHub Pages under /native/.
#
# Runs in CI instead of locally because a full `yarn install` of this
# monorepo's root devDependencies (Storybook 8, Playwright, webpack,
# Vega, @react-spectrum/s2, ...) reliably OOMs on a 6GB local machine;
# GitHub-hosted runners have much more headroom.

on:
  push:
    branches:
      - rn/native-storybook
  workflow_dispatch: {}

concurrency:
  group: gh-pages-deploy-native-storybook
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      CI: '1'
      EXPO_NO_TELEMETRY: '1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Not the repo's .nvmrc (20) — the resolved tree pulls in
          # react-native@0.87.1 transitively, which requires Node
          # ^22.13/^24.3/>=26, and this workspace has engine-strict on.
          node-version: '22'

      - name: Report runner memory
        run: free -h

      - name: Install dependencies
        # yarn classic v1's resolver reliably OOMs on this monorepo's
        # dependency graph even at a 14GB heap ceiling on a 15GB runner
        # (confirmed) — npm's resolver handles the same workspaces
        # layout (package.json's "workspaces" field is npm 7+
        # compatible) without that blowup. --legacy-peer-deps because
        # the root's React 19 devDependency conflicts with
        # @adobe/react-spectrum's React 16/17/18 peer range; harmless
        # here since this is a disposable CI checkout.
        run: npm install --legacy-peer-deps

      - name: Build @spectrum-charts/themes
        run: npm run build --workspace=@spectrum-charts/themes

      - name: Build @spectrum-charts/constants
        run: npm run build --workspace=@spectrum-charts/constants

      - name: Build @spectrum-charts/utils
        run: npm run build --workspace=@spectrum-charts/utils

      - name: Build @spectrum-charts/locales
        run: npm run build --workspace=@spectrum-charts/locales

      - name: Build @spectrum-charts/vega-spec-builder
        run: npm run build --workspace=@spectrum-charts/vega-spec-builder

      - name: Build @spectrum-charts/react-spectrum-charts-native
        run: npm run build --workspace=@spectrum-charts/react-spectrum-charts-native

      - name: Build @spectrum-charts/react-spectrum-charts-native-charts
        run: npm run build --workspace=@spectrum-charts/react-spectrum-charts-native-charts

      - name: Generate on-device Storybook story registry
        run: npm run storybook-generate --workspace=@spectrum-charts/react-spectrum-charts-native-storybook

      - name: Export static web build
        run: npx expo export --platform web --output-dir dist
        working-directory: packages/react-spectrum-charts-native-storybook

      - name: Deploy to GitHub Pages (/native/)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/react-spectrum-charts-native-storybook/dist
          publish_branch: gh-pages
          destination_dir: native
          keep_files: true
